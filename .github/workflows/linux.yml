# Builds the Linux version of Solaris (AppImage + .deb) for every published release and adds it to that release,
# together with latest-linux.yml so Linux copies of Solaris can update themselves.
# Run it by hand for an older release from the Actions tab ("Run workflow", then type the tag, e.g. v1.7.0).
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v1.7.0
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Older Ubuntu = older glibc, so the AppImage runs on more distros.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build AppImage and .deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber
