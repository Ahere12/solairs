<!doctype html>
<html lang="en" data-theme="solar">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; connect-src 'self' data: blob:; font-src 'self' data:" />
  <title>Solaris</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="update.css" />
</head>
<body>
  <div id="bg-layer" aria-hidden="true"><div class="bg-img"></div><div class="bg-fx"></div></div>
  <div id="app">
    <header class="titlebar">
      <div class="brand"><img src="../assets/icon.png" alt="" /><span>Solaris</span><span class="ver" id="app-ver"></span></div>
      <div class="nav-arrows">
        <button class="icon-btn" id="nav-back" title="Back (Alt+←)"></button>
        <button class="icon-btn" id="nav-fwd" title="Forward (Alt+→)"></button>
      </div>
      <div class="spacer"></div>
      <button class="title-link tb-update" id="tb-update" hidden></button>
      <button class="title-link" id="tb-changelog" title="What's new"></button>
      <button class="win-btn" id="win-min" title="Minimize"></button>
      <button class="win-btn" id="win-max" title="Maximize"></button>
      <button class="win-btn close" id="win-close" title="Close"></button>
    </header>
    <div class="body">
      <aside class="sidebar">
        <div class="profile" id="account-chip"></div>
        <nav id="nav"></nav>
        <div class="side-insts" id="side-insts"></div>
        <div class="grow"></div>
        <div class="update-card" id="update-card" hidden></div>
        <div class="tasks" id="tasks"></div>
        <div class="side-tools" id="side-tools"></div>
        <div class="side-play" id="side-play"></div>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="../node_modules/skinview3d/bundles/skinview3d.bundle.js"></script>
  <script src="lib/core.js"></script>
  <script src="lib/components.js"></script>
  <script src="lib/mcicons.js"></script>
  <script src="pages/home.js"></script>
  <script src="pages/library.js"></script>
  <script src="pages/instance.js"></script>
  <script src="pages/browse.js"></script>
  <script src="pages/solaris.js"></script>
  <script src="pages/servers.js"></script>
  <script src="pages/skins.js"></script>
  <script src="pages/friends.js"></script>
  <script src="pages/gallery.js"></script>
  <script src="pages/console.js"></script>
  <script src="pages/changelog.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/login.js"></script>
  <script src="lib/update.js"></script>
  <script src="app.js"></script>
</body>
</html>
