<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="core" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#ffc24a"/>
      <stop offset="0.75" stop-color="#ff7a1f"/>
      <stop offset="1" stop-color="#f2432f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#ff8a1c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd59a"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </radialGradient>
    <!-- the part of the sun drawn over the ring (top half) so the orbit passes behind it -->
    <clipPath id="top"><path d="M0 0H512V142L0 370Z"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="214" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="148" fill="url(#core)"/>
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="228" ry="70" fill="none" stroke="#8a2410" stroke-opacity="0.55" stroke-width="30"/>
    <ellipse cx="256" cy="256" rx="228" ry="70" fill="none" stroke="url(#ring)" stroke-width="20"/>
  </g>
  <circle cx="256" cy="256" r="148" fill="url(#core)" clip-path="url(#top)"/>
  <circle cx="451" cy="208" r="29" fill="#8a2410" fill-opacity="0.55"/>
  <circle cx="451" cy="208" r="24" fill="url(#planet)"/>
</svg>
